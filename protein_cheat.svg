<line x1="45" y1="700" x2="855" y2="700" stroke="#D6B07A" stroke-width="2"/>
<text x="45" y="750" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Сохрани эту шпаргалку</text>
<text x="45" y="790" fill="#bbb" font-family="Arial,sans-serif" font-size="20">чтобы быстро выбирать удобные источники белка</text>
<text x="45" y="830" fill="#D6B07A" font-family="Arial,sans-serif" font-size="18">Balance Body • День 12</text>
